# CI gate: type-check, lint, unit tests (vitest), and the e2e regression suite
# (playwright). The e2e job is the assertion-driven replacement for manual
# click-through testing - it builds dist/ and drives a real browser.
#
# Use Playwright's pinned Chrome for Testing for reproducible browser runs.
# It includes H.264/AAC codecs; HEVC decode remains OS-dependent.
#
# WebGL (MapLibre) runs via SwiftShader. The suite is hermetic (the tile server
# is aborted in tests/e2e/_fixtures.ts), so no external network is needed;
# Retry traces aid diagnosis; a retry-only pass still fails the job.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep the runners available for the newest commit on each branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint and formatting
        run: npm run check:ci

      # CHANGELOG.md is generated from src/changelog/entries.ts; a hand edit
      # or a skipped regeneration fails here, not inside a release asset.
      - name: Changelog freshness
        run: node scripts/generate-changelog-md.mjs --check

      # Build BEFORE the unit tests: src/csp-hash.integration.test.ts asserts
      # against dist/ artifacts and fails loudly in CI when they are absent
      # (it would otherwise silently self-skip and never gate anything).
      - name: Build
        run: npm run build
        env:
          # Browser tests intercept every map request; no real API key enters CI.
          VITE_YANDEX_TILES_API_KEY: e2e-yandex-key

      - name: Unit tests (vitest)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failed shard must not cancel coverage or diagnostics from the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps --no-shell chromium

      - name: E2E tests (playwright)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --workers=1 --reporter=list,github,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/blob-report

      - name: Upload e2e blob report (incl. flaky retries)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: ${{ runner.temp }}/blob-report/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-${{ matrix.shard }}
          path: tests/e2e/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  reports:
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download e2e blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-*
          path: ${{ runner.temp }}/blob-reports
          merge-multiple: true

      - name: Merge e2e reports
        run: npx playwright merge-reports --reporter=html "$RUNNER_TEMP/blob-reports"
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: tests/playwright-report
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload e2e report (incl. flaky retries)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Keep one stable check name, including when an upstream job fails or skips.
  test:
    if: ${{ !cancelled() }}
    needs: [checks, e2e, portable, staging-build, deployment-profile, reports]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all test jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo "::error::one or more required CI jobs did not succeed"
            exit 1
          fi

  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and validate portable HTML
        run: |
          npm run build:portable -- --version "dev-${GITHUB_SHA}"
          PORTABLE_ALLOW_DEV=1 node scripts/validate-portable-artifacts.mjs
      - name: Install Playwright browser
        run: npx playwright install --with-deps --no-shell chromium
      - name: Test portable HTML from disk
        run: npx playwright test --config=tests/playwright.portable.config.ts
      - name: Upload portable failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portable-test-results
          path: tests/test-results/portable/
          retention-days: 7
          if-no-files-found: ignore

  # Exercise the hosted chunk graph without credentials or Sentry uploads.
  # The plain build tree-shakes reporting code and omits debug-ID injection.
  staging-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_NO_INDEX: "1"
      VITE_SENTRY_DSN: "https://public@example.invalid/1"
      SENTRY_AUTH_TOKEN: "synthetic-ci-token"
      SENTRY_ORG: "synthetic-ci"
      SENTRY_PROJECT: "synthetic-ci"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build with hosted instrumentation
        run: npm run build

  # The public build contract is origin-agnostic. A synthetic profile catches
  # accidental dependencies on private host or locale values without exposing
  # the real deployment configuration to this repository or PR logs.
  deployment-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOYMENT_PROFILE: mirror
      SEO_MIRROR_CONFIG: '{"origin":"https://mirror.example.test","localeSegments":["de"],"rootLocaleSegment":"de"}'
      META_CSP: "1"
      DISABLE_CLOUDFLARE_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Build synthetic mirror profile
        run: npm run build
      - name: Test synthetic mirror artifact
        run: npm run test:deployment-profile
