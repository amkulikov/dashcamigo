# Serves the dashcamigo build (see Dockerfile). Doubles as the reference for
# any other static server: site root, directory index, extension-less
# rewrites, fresh /sw.js, immutable hashed assets (docs/self-hosting.md).
server {
    listen 80;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The browser's service-worker update check must see a fresh file, or a
    # new deployment is slow to reach returning visitors.
    location = /sw.js {
        add_header Cache-Control "max-age=0, must-revalidate";
    }

    # Hashed filenames - content never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx's stock mime.types may not know .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Extension-less internal links (/privacy -> privacy.html) and the
    # /<lang>/ directory indexes.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
