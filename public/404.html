<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · dashcamigo</title>
<meta name="robots" content="noindex, follow">
<meta http-equiv="content-language" content="en">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<style>
/* Standalone page - the prod CSS bundle is hashed (assets/index-*.css), so we
   cannot link to it from a long-lived static file. Inline the minimum the
   page needs and use the same --dc-* tokens as the rest of the app. */
@font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: url("/fonts/inter-var-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
    font-family: "Space Grotesk";
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("/fonts/space-grotesk-700-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root {
    --dc-black: #000;
    --dc-white: #fff;
    --dc-orange: #ff9000;
    --dc-orange-hot: #ffa31a;
    --dc-ash-1: #1a1a1a;
    --dc-ash-3: #2a2a2a;
    --dc-ash-4: #3a3a3a;
    --dc-ash-5: #5c5c5c;
    --dc-yellow: #f5c518;
    --dc-radius-sm: 4px;
    --dc-font-brand: "Space Grotesk", "Inter", system-ui, sans-serif;
    --dc-font-display: "Inter", system-ui, sans-serif;
    --dc-font-heavy: "Inter", system-ui, sans-serif;
    --dc-font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --dc-ease: cubic-bezier(0.4, 0, 0.2, 1);
    --dc-dur-base: 120ms;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    background: var(--dc-black);
    color: var(--dc-white);
    font-family: var(--dc-font-heavy);
    display: grid;
    grid-template-rows: auto 1fr;
    -webkit-font-smoothing: antialiased;
}

.topbar {
    height: 56px;
    padding: 0 24px;
    border-bottom: 1px solid var(--dc-ash-3);
    display: flex;
    align-items: center;
}
.topbar a { text-decoration: none; color: inherit; }

/* Brand wordmark - same shape and tokens as src/styles/components/topbar.css.
   Standalone copy, the production .dc-mark class is not reachable from here. */
.dc-mark {
    display: inline-flex;
    align-items: center;
    gap: 0.22em;
    font-family: var(--dc-font-brand);
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
    letter-spacing: -0.02em;
    text-transform: lowercase;
    color: var(--dc-white);
    user-select: none;
}
.dc-mark__icon {
    width: 1.1em;
    height: 1.1em;
    flex-shrink: 0;
}

main {
    display: grid;
    place-items: center;
    padding: 48px 24px;
}
.stage {
    display: grid;
    justify-items: center;
    gap: 36px;
    text-align: center;
}

/* Horizontal traffic signal - the metaphor is "flashing amber at an
   unmarked intersection: proceed with caution". Reads across cultures. */
.signal {
    --lamp: clamp(96px, 18vw, 170px);
    --gap:  clamp(14px, 2vw, 24px);
    --pad:  clamp(18px, 2.4vw, 28px);
    display: inline-flex;
    align-items: center;
    gap: var(--gap);
    padding: var(--pad);
    background: var(--dc-ash-1);
    border: 1px solid var(--dc-ash-3);
    border-radius: 12px;
    box-shadow:
        inset 0  1px 0 var(--dc-ash-4),
        inset 0 -1px 0 #000;
    position: relative;
}
/* Mounting tabs - the housing reads as bolted to a cross-cable. */
.signal::before,
.signal::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 14px;
    height: 4px;
    background: var(--dc-ash-4);
    border-radius: 2px;
    transform: translateY(-50%);
}
.signal::before { left: -14px; }
.signal::after  { right: -14px; }

.lamp {
    width: var(--lamp);
    height: var(--lamp);
    border-radius: 50%;
    background: #000;
    box-shadow:
        inset 0 0 0 2px #000,
        inset 0 4px 10px rgba(0, 0, 0, 0.9);
    display: grid;
    place-items: center;
    font-family: var(--dc-font-display);
    font-weight: 900;
    font-size: calc(var(--lamp) * 0.62);
    line-height: 1;
    color: var(--dc-ash-5);
    letter-spacing: -0.04em;
}

.lamp--on {
    background: var(--dc-yellow);
    color: transparent;
    /* Stacked halo + inset specular - both required, drops either one and
       the bulb reads as a flat disk instead of a glowing lens. */
    box-shadow:
        0 0 28px  4px rgba(245, 197, 24, 0.55),
        0 0 80px 12px rgba(245, 197, 24, 0.25),
        inset 0 -8px 16px rgba(0, 0, 0, 0.18),
        inset 0  8px 14px rgba(255, 255, 255, 0.35);
    animation: blink 1.1s steps(1, end) infinite;
}
/* Step-timed (no fade), 50/50 duty cycle. The off-phase keeps a faint inner
   shadow so the lamp still reads as a glass bulb, not a hole. */
@keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% {
        opacity: 0.18;
        box-shadow: inset 0 -6px 14px rgba(0, 0, 0, 0.4);
    }
}

.btn {
    background: var(--dc-orange);
    color: var(--dc-black);
    padding: 14px 22px;
    font-family: var(--dc-font-heavy);
    font-weight: 700;
    font-size: 14px;
    border-radius: var(--dc-radius-sm);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 0;
    cursor: pointer;
    transition: background var(--dc-dur-base) var(--dc-ease);
}
.btn:hover { background: var(--dc-orange-hot); }
.btn:focus-visible {
    outline: 2px solid var(--dc-orange);
    outline-offset: 2px;
}
.btn .arrow { font-family: var(--dc-font-mono); font-weight: 400; }

@media (prefers-reduced-motion: reduce) {
    .lamp--on { animation: none; }
}
</style>
</head>
<body>

<header class="topbar">
    <a href="/" aria-label="dashcamigo home">
        <span class="dc-mark">dashcamigo<svg class="dc-mark__icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect x="3" y="7" width="26" height="20" rx="3" fill="currentColor"/>
            <rect x="14" y="4" width="4" height="3" rx="0.6" fill="currentColor"/>
            <circle cx="16" cy="17" r="7" fill="#FF9000"/>
            <circle cx="16" cy="17" r="4" fill="#000"/>
            <circle cx="14" cy="15" r="1.4" fill="rgba(255,255,255,0.5)"/>
        </svg></span>
    </a>
</header>

<main>
    <div class="stage">
        <div class="signal" role="img" aria-label="404 - flashing yellow signal">
            <div class="lamp" aria-hidden="true">4</div>
            <div class="lamp lamp--on" aria-hidden="true"></div>
            <div class="lamp" aria-hidden="true">4</div>
        </div>
        <a class="btn" href="/"><span class="arrow">&larr;</span> Back home</a>
    </div>
</main>

</body>
</html>
