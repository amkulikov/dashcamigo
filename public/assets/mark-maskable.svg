<!--
  Maskable variant of the brand mark for PWA icons.

  PWA spec: a maskable icon's significant content must fit inside the
  inner circle of radius 0.4 * canvas (the "safe zone"). The OS may apply
  any shape mask (circle, squircle, rounded square) to the rest, so:
    - the background fills the full 512x512 quad (no rounding here -
      the OS supplies the corners);
    - the camera glyph sits centered, scaled to fit within the safe zone.

  Glyph geometry (matches mark.svg):
    - body rect 3..29 x 7..27 (26x20 units)
    - top flange 14..18 x 4..7  (4x3 units)
    - lens circle r=7 at (16,17)
  Bounding box: 26 x 23 units centered at (16, 15.5).
  scale=11 → bbox 286x253; half-diagonal from center = ~191 ≤ 205 (safe
  radius for 512x512), with some breathing room.
  translate=(80, 85.5) maps (16*11, 15.5*11) = (176, 170.5) → (256, 256).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <rect width="512" height="512" fill="#000"/>
    <g transform="translate(80 85.5) scale(11)">
        <rect x="3" y="7" width="26" height="20" rx="3" fill="#fff"/>
        <rect x="14" y="4" width="4" height="3" rx="0.6" fill="#fff"/>
        <circle cx="16" cy="17" r="7" fill="#FF9000"/>
        <circle cx="16" cy="17" r="4" fill="#0E0E0E"/>
        <circle cx="14" cy="15" r="1.4" fill="#fff" fill-opacity="0.5"/>
    </g>
</svg>
